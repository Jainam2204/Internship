<!DOCTYPE html>
<html lang="en">

<head>

<body>
    <a href="./index.html">Home Page</a>

    <div class="container">

        <div class="top_div">

            <form id="userForm">
                <fieldset>
                    <legend>Add User</legend>
                    <input type="hidden" id="editUserIndex" value="">

                    <label>Name :</label>
                    <input type="text" id="userName" required><br><br>
                    <small style="color:red;" id="namePatternUser"></small><br><br>


                    <label>Password</label>
                    <input type="password" id="password" required><br><br>

                    <label>Email</label>
                    <input type="email" id="email" required><br><br>
                    <small style="color:red;" id="emailMatch"></small><br><br>

                    <input type="submit" value="Submit">
                </fieldset>
            </form>
            <h3 style="color:red" id="err"></h3>


        </div>

        <div class="bottom_div">
            <h3 id="totalStudents"></h3>
