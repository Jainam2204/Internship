<!DOCTYPE html>
<html>
<head>
  <title>Student Form</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <button id="logoutBtn">Logout</button>

  <form id="studentForm">
    <fieldset>
      <legend id="formTitle">Add Student</legend>

      <label>Name :</label>
      <input type="text" id="name" required />
      <br><small id="namePattern" style="color:red;"></small><br>

      <label>Roll No :</label>
      <input type="number" id="rollNo" required />
      <br><small id="rollNoPattern" style="color:red;"></small><br>

      <label>Class :</label>
      <select id="class">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select><br><br>

      <label>Subject 1 :</label>
      <input type="number" id="sub1" required /><br><br>

      <label>Subject 2 :</label>
      <input type="number" id="sub2" required /><br><br>

      <label>Subject 3 :</label>
      <input type="number" id="sub3" required /><br><br>

      <input type="hidden" id="studentId" />
      <input type="submit" value="Submit" />
    </fieldset>
  </form>

  <h3 id="tableDetails"></h3>

  <table id="showStudentTable" style="display:none;">
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Roll</th><th>Class</th>
        <th>Sub1</th><th>Sub2</th><th>Sub3</th>
        <th>Result</th><th>Avg</th><th>Edit</th><th>Delete</th>
      </tr>
    </thead>
    <tbody id="showStudentdata"></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
